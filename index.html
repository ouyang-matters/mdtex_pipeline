<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MDTeX Pipeline - Markdown + LaTeX Publisher</title>
  <link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Toolbar -->
    <header class="toolbar">
      <div class="toolbar-left">
        <span class="app-title">MDTeX Pipeline</span>
        <button id="btn-open" class="toolbar-btn" title="Open .md file">Open</button>
        <input type="file" id="file-input" accept=".md,.markdown,.txt" hidden />
      </div>
      <div class="toolbar-center">
        <label>Style:
          <select id="select-theme"></select>
        </label>
        <button id="btn-edit-css" class="toolbar-btn" title="Edit CSS style">Edit CSS</button>
        <label>Platform:
          <select id="select-platform">
            <option value="wechat" selected>WeChat</option>
            <option value="zhihu">Zhihu</option>
          </select>
        </label>
      </div>
      <div class="toolbar-right">
        <button id="btn-copy-rich" class="toolbar-btn primary" title="Copy as rich text for pasting into platform editor">Copy for Platform</button>
        <button id="btn-copy-html" class="toolbar-btn" title="Copy raw HTML">Copy HTML</button>
        <button id="btn-export" class="toolbar-btn" title="Export HTML file">Export</button>
      </div>
    </header>

    <!-- Main content -->
    <main class="editor-layout">
      <!-- Left: Markdown source editor -->
      <div class="editor-pane">
        <div class="pane-header">Markdown Source</div>
        <textarea id="editor" spellcheck="false" placeholder="Paste or type Markdown here..."></textarea>
      </div>

      <!-- Right: Live preview -->
      <div class="preview-pane">
        <div class="pane-header">
          Preview
          <span id="preview-platform-label" class="platform-label">WeChat</span>
        </div>
        <div id="preview-container" class="preview-container">
          <div id="preview-content"></div>
        </div>
      </div>
    </main>

    <!-- CSS Editor Panel (hidden by default) -->
    <div id="css-editor-panel" class="css-editor-panel hidden">
      <div class="css-editor-header">
        <span id="css-editor-title">Edit CSS Style</span>
        <span id="css-unsaved-indicator" class="unsaved-indicator hidden">unsaved</span>
        <div class="css-editor-actions">
          <button id="btn-css-save" class="toolbar-btn" title="Save changes">Save</button>
          <button id="btn-css-save-as" class="toolbar-btn" title="Save as new custom style">Save As...</button>
          <button id="btn-css-duplicate" class="toolbar-btn" title="Duplicate this style">Duplicate</button>
          <button id="btn-css-rename" class="toolbar-btn" title="Rename custom style">Rename</button>
          <button id="btn-css-delete" class="toolbar-btn" title="Delete custom style">Delete</button>
          <button id="btn-css-revert" class="toolbar-btn" title="Revert to saved version">Revert</button>
          <button id="btn-css-close" class="toolbar-btn" title="Close CSS editor">Close</button>
        </div>
      </div>
      <textarea id="css-editor" spellcheck="false" placeholder="/* Write your CSS scoped under #nice */"></textarea>
    </div>

    <!-- Diagnostics bar -->
    <footer class="diagnostics-bar" id="diagnostics">
      <span id="diag-stats"></span>
      <span id="diag-warnings"></span>
    </footer>
  </div>

  <script type="module" src="/src/ui/main.js"></script>
</body>
</html>
