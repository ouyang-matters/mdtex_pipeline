<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MDTeX – Academic Writing & Publishing</title>
  <link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Toolbar -->
    <header class="toolbar">
      <div class="toolbar-left">
        <button id="btn-toggle-library" class="toolbar-btn" title="Toggle article library">Library</button>
        <span class="app-title">MDTeX</span>
        <button id="btn-open" class="toolbar-btn" title="Open .md/.tex file">Open</button>
        <input type="file" id="file-input" accept=".md,.markdown,.txt,.tex" hidden />
        <input type="file" id="image-input" accept="image/*" hidden />
      </div>
      <div class="toolbar-center">
        <span id="article-title" class="article-title-display" title="Click to rename"></span>
        <label>Style:
          <select id="select-theme"></select>
        </label>
        <button id="btn-edit-css" class="toolbar-btn" title="Edit CSS style">CSS</button>
        <label>Target:
          <select id="select-platform">
            <option value="wechat" selected>WeChat</option>
            <option value="zhihu">Zhihu</option>
          </select>
        </label>
      </div>
      <div class="toolbar-right">
        <button id="btn-copy-rich" class="toolbar-btn primary" title="Copy as rich text">Copy for Platform</button>
        <button id="btn-copy-html" class="toolbar-btn" title="Copy raw HTML">HTML</button>
        <button id="btn-export" class="toolbar-btn" title="Export HTML file">Export</button>
        <button id="btn-toggle-ai" class="toolbar-btn" title="Toggle AI panel">AI</button>
      </div>
    </header>

    <!-- Main layout -->
    <main class="workspace-layout">
      <!-- Left: Article Library -->
      <aside id="library-panel" class="library-panel">
        <div class="library-header">
          <input id="library-search" type="text" placeholder="Search articles..." class="library-search" />
        </div>
        <div class="library-actions">
          <button id="btn-new-article" class="toolbar-btn" title="New article">+ Article</button>
          <button id="btn-new-folder" class="toolbar-btn" title="New folder">+ Folder</button>
        </div>
        <div id="library-list" class="library-list"></div>
      </aside>

      <!-- Center: Source editor -->
      <div class="editor-pane" id="editor-pane">
        <div class="pane-header">
          <span>Source</span>
          <span id="editor-format-label" class="format-label">MD</span>
          <div class="editor-toolbar" id="editor-toolbar"></div>
          <button id="btn-insert-image" class="toolbar-btn" title="Insert image" style="padding:1px 6px;font-size:11px;">Img</button>
          <button id="btn-snippets" class="toolbar-btn" title="Insert snippet" style="padding:1px 6px;font-size:11px;">Insert</button>
          <button id="btn-compile-pdf" class="toolbar-btn" title="Compile PDF" style="padding:1px 6px;font-size:11px;">PDF</button>
        </div>
        <textarea id="editor" spellcheck="false" placeholder="Write Markdown or LaTeX here. Drag & drop images into the editor."></textarea>
        <!-- Snippet palette (hidden by default) -->
        <div id="snippet-palette" class="snippet-palette hidden"></div>
      </div>

      <!-- Right: Live preview -->
      <div class="preview-pane">
        <div class="pane-header">
          Preview
          <span id="preview-platform-label" class="platform-label">WeChat</span>
        </div>
        <div id="preview-container" class="preview-container">
          <div id="preview-content"></div>
        </div>
      </div>
    </main>

    <!-- Bottom panels (CSS editor / AI / Build output) -->
    <div id="bottom-panel" class="bottom-panel hidden">
      <!-- Tab bar -->
      <div class="bottom-panel-tabs">
        <button class="bottom-tab active" data-tab="css">CSS Editor</button>
        <button class="bottom-tab" data-tab="ai">AI Assistant</button>
        <button class="bottom-tab" data-tab="build">Build Output</button>
        <button id="btn-close-bottom" class="toolbar-btn" style="margin-left:auto;padding:1px 6px;font-size:11px;">Close</button>
      </div>

      <!-- CSS Editor tab -->
      <div class="bottom-tab-content active" data-tab="css">
        <div class="css-editor-header">
          <span id="css-editor-title">Style</span>
          <span id="css-unsaved-indicator" class="unsaved-indicator hidden">unsaved</span>
          <div class="css-editor-actions">
            <button id="btn-css-save" class="toolbar-btn">Save</button>
            <button id="btn-css-save-as" class="toolbar-btn">Save As</button>
            <button id="btn-css-duplicate" class="toolbar-btn">Dup</button>
            <button id="btn-css-rename" class="toolbar-btn">Rename</button>
            <button id="btn-css-delete" class="toolbar-btn">Del</button>
            <button id="btn-css-revert" class="toolbar-btn">Revert</button>
          </div>
        </div>
        <textarea id="css-editor" spellcheck="false" placeholder="/* CSS scoped under #nice */"></textarea>
      </div>

      <!-- AI Assistant tab -->
      <div class="bottom-tab-content" data-tab="ai">
        <div class="ai-panel">
          <div class="ai-messages" id="ai-messages">
            <div class="ai-welcome">Ask Claude to edit your article content or CSS theme.</div>
          </div>
          <div class="ai-input-row">
            <select id="ai-scope" class="toolbar-btn" style="font-size:11px;">
              <option value="content">Edit Content</option>
              <option value="theme">Edit Theme CSS</option>
              <option value="convert-to-latex">Convert MD → LaTeX</option>
              <option value="convert-to-md">Convert LaTeX → MD</option>
              <option value="fix-compile">Fix Compile Error</option>
            </select>
            <input type="text" id="ai-prompt" class="ai-prompt-input" placeholder="e.g. Make the h2 headings use a left blue border..." />
            <button id="btn-ai-send" class="toolbar-btn primary" style="padding:3px 10px;">Send</button>
          </div>
        </div>
      </div>

      <!-- Build Output tab -->
      <div class="bottom-tab-content" data-tab="build">
        <div id="build-output" class="build-output">
          <div class="ai-welcome">Build output will appear here after compilation.</div>
        </div>
      </div>
    </div>

    <!-- Diagnostics bar -->
    <footer class="diagnostics-bar" id="diagnostics">
      <span id="diag-stats"></span>
      <span id="diag-warnings"></span>
    </footer>
  </div>

  <script type="module" src="/src/ui/main.js"></script>
</body>
</html>
