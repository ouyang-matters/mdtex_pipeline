<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MDTeX Pipeline - Markdown + LaTeX Publisher</title>
  <link rel="stylesheet" href="/src/ui/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Toolbar -->
    <header class="toolbar">
      <div class="toolbar-left">
        <span class="app-title">MDTeX Pipeline</span>
        <button id="btn-open" class="toolbar-btn" title="Open .md file">Open</button>
        <input type="file" id="file-input" accept=".md,.markdown,.txt" hidden />
      </div>
      <div class="toolbar-center">
        <label>Theme:
          <select id="select-theme"></select>
        </label>
        <label>Platform:
          <select id="select-platform">
            <option value="wechat" selected>WeChat</option>
            <option value="zhihu">Zhihu</option>
          </select>
        </label>
      </div>
      <div class="toolbar-right">
        <button id="btn-copy-rich" class="toolbar-btn primary" title="Copy as rich text for pasting into platform editor">Copy for Platform</button>
        <button id="btn-copy-html" class="toolbar-btn" title="Copy raw HTML">Copy HTML</button>
        <button id="btn-export" class="toolbar-btn" title="Export HTML file">Export</button>
        <button id="btn-reload-css" class="toolbar-btn" title="Reload theme CSS">Reload CSS</button>
      </div>
    </header>

    <!-- Main content -->
    <main class="editor-layout">
      <!-- Left: Markdown source editor -->
      <div class="editor-pane">
        <div class="pane-header">Markdown Source</div>
        <textarea id="editor" spellcheck="false" placeholder="Paste or type Markdown here..."></textarea>
      </div>

      <!-- Right: Live preview -->
      <div class="preview-pane">
        <div class="pane-header">
          Preview
          <span id="preview-platform-label" class="platform-label">WeChat</span>
        </div>
        <div id="preview-container" class="preview-container">
          <div id="preview-content"></div>
        </div>
      </div>
    </main>

    <!-- Diagnostics bar -->
    <footer class="diagnostics-bar" id="diagnostics">
      <span id="diag-stats"></span>
      <span id="diag-warnings"></span>
    </footer>
  </div>

  <script type="module" src="/src/ui/main.js"></script>
</body>
</html>
